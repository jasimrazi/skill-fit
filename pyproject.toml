[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-fit"
version = "0.1.0"
description = "Agent skill that scans your repo, writes a compact project map into CLAUDE.md/AGENTS.md, and audits idle skill token cost."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = [
    "agent-skills",
    "claude-code",
    "claude-md",
    "agents-md",
    "context-engineering",
    "token-optimization",
    "project-map",
    "ai-coding",
    "developer-tools",
    "llm-context",
    "prompt-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/jasimrazi/skill-fit"
Repository = "https://github.com/jasimrazi/skill-fit"
Issues = "https://github.com/jasimrazi/skill-fit/issues"
Documentation = "https://github.com/jasimrazi/skill-fit#readme"
Changelog = "https://github.com/jasimrazi/skill-fit/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["skill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
